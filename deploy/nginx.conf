worker_processes 1;
daemon off;
pid /home/deshin/pate-runtime/nginx.pid;
error_log /home/deshin/pate-runtime/nginx-error.log warn;

events {
    worker_connections 256;
}

http {
    client_body_temp_path /home/deshin/pate-runtime/nginx-temp;
    access_log /home/deshin/pate-runtime/nginx-access.log;
    client_max_body_size 4m;

    server {
        listen 127.0.0.1:18001;
        server_name _;
        server_tokens off;
        auth_basic "Pate tools";
        auth_basic_user_file /home/deshin/pate-runtime/secrets/operator.htpasswd;
        add_header Cache-Control "no-store" always;

        location = /tortikipirogi {
            proxy_pass http://127.0.0.1:8001/;
        }

        location = /tortikipirogi/ {
            proxy_pass http://127.0.0.1:8001/;
        }

        location /api/tortikipirogi/ {
            proxy_pass http://127.0.0.1:8001;
        }

        location = /mamin-hleb {
            proxy_pass http://127.0.0.1:8001;
        }

        location = /mamin-hleb/ {
            proxy_pass http://127.0.0.1:8001/mamin-hleb;
        }

        location /api/mamin-hleb/ {
            proxy_pass http://127.0.0.1:8001;
        }

        location /images/tortiki/ {
            proxy_pass http://127.0.0.1:8001;
        }

        location / {
            proxy_pass http://127.0.0.1:8000;
        }
    }
}
